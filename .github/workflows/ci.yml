name: CI

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install AVR toolchain and Arduino core
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-avr avr-libc arduino-core-avr
      - name: Compile both sketches for the Uno
        run: bash tools/firmware/build.sh
